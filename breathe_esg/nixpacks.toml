[phases.setup]
nixPkgs = ["(python312.withPackages (ps: [ps.pip]))", "nodejs_20"]

[phases.install]
cmds = [
  "pip3 install -r backend/requirements.txt", 
  "cd frontend && npm ci"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "python3 backend/manage.py collectstatic --noinput --settings=config.settings.production"
]

[start]
cmd = "cd backend && python3 -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"