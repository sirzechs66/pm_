[phases.setup]
nixPkgs = ["python312", "nodejs_20"]

[phases.install]
cmds = ["pip install -r backend/requirements.txt", "cd frontend && npm ci"]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "python backend/manage.py migrate --settings=config.settings.production",
  "python backend/manage.py collectstatic --noinput --settings=config.settings.production"
]

[start]
cmd = "cd backend && gunicorn config.wsgi:application"
