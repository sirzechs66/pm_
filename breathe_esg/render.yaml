services:
  - type: web
    name: breathe-esg-prototype
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build && cd .. && python backend/manage.py migrate --settings=config.settings.production && python backend/manage.py collectstatic --noinput --settings=config.settings.production
    startCommand: cd backend && gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: breathe-esg-prototype.onrender.com
